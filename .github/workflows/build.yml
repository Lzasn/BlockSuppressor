name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Verify jar contents
        run: |
          unzip -l target/BlockSuppressor-*.jar
          unzip -l target/BlockSuppressor-*.jar | grep -q 'plugin.yml'
          unzip -l target/BlockSuppressor-*.jar | grep -q 'com/lzasn/blocksuppressor/BlockSuppressorPlugin.class'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockSuppressor
          path: target/BlockSuppressor-*.jar
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            target/BlockSuppressor-*.jar \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
