name: BlockSuppressor
version: 1.3.0
main: com.lzasn.blocksuppressor.BlockSuppressorPlugin
api-version: '26.2'
folia-supported: true
description: 铁砧重命名容器 + 比较器形式的方块更新抑制器（切门 / 悬空方块）
author: Lzasn
authors: [Lzasn]

commands:
  suppressor:
    description: 方块抑制器管理
    usage: /suppressor <list|remove|reload>
    aliases: [bss]
    permission: blocksuppressor.admin

permissions:
  blocksuppressor.admin:
    description: 使用 /suppressor 管理抑制器
    default: op
